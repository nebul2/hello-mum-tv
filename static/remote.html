<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mum's TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EC; --ink:#1E2B3A; --soft:#5B6B78; --panel:#FFFFFF;
  --sage:#4F7A5A; --glass:#16212C; --glow:#F2C14E; --stop:#A8432F; --line:#D5DBD3;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141B21; --ink:#E7ECE6; --soft:#98A6A0; --panel:#1E2830;
    --sage:#7FB08A; --glass:#0A0F13; --line:#2C3740; color-scheme: dark; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:18px;line-height:1.4;padding:env(safe-area-inset-top,0) 16px calc(24px + env(safe-area-inset-bottom,0));}
main{max-width:460px;margin:0 auto}
h1{font-size:1.1rem;font-weight:700;margin:18px 2px 10px;color:var(--soft)}

.screen{background:var(--glass);border-radius:22px;padding:10px;box-shadow:0 0 0 6px var(--panel), 0 0 0 7px var(--line)}
.glass{aspect-ratio:16/9;border-radius:14px;display:flex;flex-direction:column;justify-content:center;
  padding:18px 22px;color:#F4F6F2;background:#0E151B;transition:background .6s ease}
.glass.on{background:radial-gradient(120% 120% at 20% 10%, #2E4A5E 0%, #16242F 60%, #0E151B 100%)}
.glass .what{font-size:1.9rem;font-weight:700;line-height:1.15}
.glass .sub{margin-top:6px;color:#AFC0C9;font-size:1rem}
.glass.off .what{color:#6E7D86}
.glass.err .what{color:var(--glow)}
.glass{position:relative;overflow:hidden}
#shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.glass.pi #shot.ok{display:block}
.stand{width:34%;height:8px;margin:12px auto 0;border-radius:0 0 8px 8px;background:var(--line)}

section{margin-top:22px}
section h2{font-size:1rem;font-weight:700;margin:0 2px 8px;color:var(--soft)}
.row{display:grid;gap:10px}
.two{grid-template-columns:1fr 1fr}
.three{grid-template-columns:1fr 1fr 1fr}
button{font:inherit;font-weight:700;color:var(--ink);background:var(--panel);border:1px solid var(--line);
  border-radius:14px;min-height:62px;padding:10px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible{outline:3px solid var(--sage);outline-offset:2px}
button[disabled]{opacity:.5}
.on-btn{background:var(--sage);border-color:var(--sage);color:#fff}
.off-btn{color:var(--stop)}
.big{font-size:1.6rem}
.ch small{display:block;font-weight:400;color:var(--soft);font-size:.85rem}

.callbox{display:grid;grid-template-columns:1fr auto;gap:10px}
.callbox input{font:inherit;min-height:62px;padding:0 14px;border-radius:14px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);min-width:0}
.call-btn{background:var(--sage);border-color:var(--sage);color:#fff;padding:10px 22px}

details{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 12px 12px}
summary{cursor:pointer;font-weight:700;padding:10px 2px;color:var(--soft)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:280px;margin:6px auto}
.pad button{min-height:58px}

/* call view */
#callview{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;gap:10px;background:#0B1116;color:#F4F6F2;
  padding:calc(10px + env(safe-area-inset-top,0)) 12px calc(12px + env(safe-area-inset-bottom,0))}
#callview.show{display:flex}
.stage{position:relative;flex:1;min-height:0;border-radius:16px;overflow:hidden;background:#000}
#mumVideo{width:100%;height:100%;object-fit:contain;display:block}
#meVideo{position:absolute;right:10px;bottom:10px;width:28%;max-width:150px;border-radius:10px;transform:scaleX(-1);background:#222}
#callStatus{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:1.35rem;font-weight:700;padding:20px;pointer-events:none}
#callStatus:empty{display:none}
#caption{min-height:2.8em;font-size:1.05rem;color:var(--glow);white-space:pre-line;padding:0 4px}
#caption:empty::before{content:"Subtitles on Mum's TV appear here.";color:#6E7D86}
#caption.nostt:empty::before{content:""}
#callview button{background:#1C2833;border-color:#2C3B47;color:#F4F6F2}
#callview .louder{background:var(--sage);border-color:var(--sage)}
#callview .hang{background:var(--stop);border-color:var(--stop)}
.callinfo{display:flex;align-items:center;gap:10px;font-size:.9rem;color:#AFC0C9;padding:0 4px}
.meter{flex:1;height:12px;border-radius:6px;background:#1C2833;overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:6px;background:var(--sage);transition:width .4s linear}
.meter i.loud{background:var(--glow)}
.volnote{margin:8px 2px 0;color:var(--soft);font-size:.9rem}
.camctl{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
#callview .camctl button{min-height:46px;padding:4px;font-size:1.05rem}
#callview .camctl .reset{font-size:.8rem}
.callctl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* "about to call" step: pixelated view of the room, then Call now / Not now */
#peek{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none;image-rendering:pixelated}
.peekbar{display:none;grid-template-columns:1fr 1fr;gap:10px}
.peeknote{display:none;margin:0 4px;font-size:.95rem;color:#AFC0C9}
#callview.preview #peek{display:block}
#callview.preview .peekbar{display:grid}
#callview.preview .peeknote{display:block}
#callview.preview .camctl, #callview.preview .callctl, #callview.preview #caption, #callview.preview .callinfo, #callview.preview #meVideo{display:none}
.callctl .wide{grid-column:1 / -1}

.toast{position:fixed;z-index:20;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.95rem;opacity:0;
  transition:opacity .25s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>Mum's bedroom TV</h1>

  <div class="screen" aria-live="polite">
    <div class="glass" id="glass">
      <div class="what" id="what">Checking the TV…</div>
      <div class="sub" id="sub"></div>
      <img id="shot" alt="Live picture of what the Pi is showing on Mum's TV">
    </div>
  </div>
  <div class="stand"></div>

  <section>
    <h2>Video call</h2>
    <div class="callbox">
      <input id="name" placeholder="Your name" autocomplete="given-name" aria-label="Your name">
      <button class="call-btn" id="callBtn">Call Mum</button>
    </div>
  </section>

  <section>
    <h2>Power</h2>
    <div class="row two">
      <button class="on-btn" data-key="PowerOn">Turn on</button>
      <button class="off-btn" data-key="PowerOff" data-confirm="Turn off Mum's TV?">Turn off</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button data-app="clock" data-confirm="Show the clock on Mum's TV? This replaces what she is watching.">Show clock (day, time, date)</button>
    </div>
  </section>

  <section>
    <h2>Volume</h2>
    <div class="row three">
      <button class="big" data-key="VolumeDown" data-n="2" aria-label="Quieter">−</button>
      <button data-key="VolumeMute">Mute</button>
      <button class="big" data-key="VolumeUp" data-n="2" aria-label="Louder">+</button>
    </div>
    <div class="row three" style="margin-top:10px">
      <button data-vol="normal" data-confirm="Set Mum's TV to Normal (18)? It goes silent for about 10 seconds first.">Normal</button>
      <button data-vol="loud" data-confirm="Set Mum's TV to Loud (45)? It goes silent for about 10 seconds first.">Loud</button>
      <button data-vol="veryloud" data-confirm="Set Mum's TV to VERY loud (75)? It goes silent for about 10 seconds first.">Very loud</button>
    </div>
    <p class="volnote" id="volNote"></p>
  </section>

  <section>
    <h2>Channels</h2>
    <div class="row three">
      <button class="ch" data-ch="1">1<small>BBC One</small></button>
      <button class="ch" data-ch="2">2<small>BBC Two</small></button>
      <button class="ch" data-ch="3">3<small>ITV1</small></button>
      <button class="ch" data-ch="4">4<small>Channel 4</small></button>
      <button class="ch" data-ch="5">5<small>Channel 5</small></button>
      <button data-app="tvinput.dtv">Live TV</button>
    </div>
    <div class="row two" style="margin-top:10px">
      <button data-key="ChannelDown">Channel down</button>
      <button data-key="ChannelUp">Channel up</button>
    </div>
  </section>

  <section>
    <h2>Apps</h2>
    <div class="row two">
      <button data-app="11703">BBC iPlayer</button>
      <button data-app="42329">ITVX</button>
      <button data-app="34785">Channel 4</button>
      <button data-app="27424">5</button>
      <button data-app="27181">Sky News</button>
      <button data-app="837">YouTube</button>
      <button data-app="12">Netflix</button>
      <button data-app="13">Prime Video</button>
      <button data-app="22297">Spotify</button>
    </div>
  </section>

  <details>
    <summary>Menu buttons</summary>
    <div class="pad">
      <span></span><button data-key="Up" aria-label="Up">▲</button><span></span>
      <button data-key="Left" aria-label="Left">◀</button>
      <button data-key="Select">OK</button>
      <button data-key="Right" aria-label="Right">▶</button>
      <button data-key="Back">Back</button><button data-key="Down" aria-label="Down">▼</button><button data-key="Home">Home</button>
    </div>
    <div class="row two" style="margin-top:8px">
      <button data-key="Play">Play / pause</button>
      <button data-key="Info">Options</button>
    </div>
  </details>
</main>

<div id="callview" role="dialog" aria-label="Call with Mum">
  <div class="stage">
    <video id="mumVideo" autoplay playsinline></video>
    <video id="meVideo" autoplay playsinline muted></video>
    <img id="peek" alt="Pixelated view of Mum's room">
    <div id="callStatus"></div>
  </div>
  <p class="peeknote">Mum's TV is saying you're about to call, and to wave if it's not a good time. Nothing is recorded.</p>
  <div class="peekbar">
    <button class="louder" id="callNowBtn">Call now</button>
    <button class="hang" id="notNowBtn">Not now</button>
  </div>
  <div id="caption" aria-live="polite"></div>
  <div class="callinfo">
    <span id="callVol"></span>
    <span>Room sound</span>
    <div class="meter" role="img" aria-label="How loud it is in Mum's room"><i id="meterBar"></i></div>
  </div>
  <div class="camctl" aria-label="Camera view">
    <button data-cam="zoomout" aria-label="Zoom out">−</button>
    <button data-cam="zoomin" aria-label="Zoom in">+</button>
    <button data-cam="left" aria-label="Look left">◀</button>
    <button data-cam="up" aria-label="Look up">▲</button>
    <button data-cam="down" aria-label="Look down">▼</button>
    <button data-cam="right" aria-label="Look right">▶</button>
    <button data-cam="reset" class="reset">Wide</button>
  </div>
  <div class="callctl">
    <button data-key="VolumeDown" data-n="2">Quieter</button>
    <button class="louder" data-key="VolumeUp" data-n="3">Louder</button>
    <button id="micBtn">Mute my mic</button>
    <button class="hang" id="hangBtn">Hang up</button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
const $ = id => document.getElementById(id);
const glass = $('glass'), what = $('what'), sub = $('sub'), toast = $('toast');

/* ---------- TV status + remote ---------- */
function volText(v){
  if(!v) return '';
  if(v.busy) return 'Setting volume…';
  return v.est === null ? '' : 'TV volume about ' + v.est;
}
function render(s){
  if(s && s.vol) $('volNote').textContent = volText(s.vol) ||
    'Volume unknown. Normal, Loud or Very loud sets a known level. Mum\'s own remote can change it.';
  glass.className = 'glass';
  if(!s || !s.reachable){
    glass.classList.add('err');
    what.textContent = "Can't reach the TV";
    sub.textContent = "Check it is plugged in and connected to WiFi.";
    return;
  }
  if(s.power !== 'PowerOn'){
    glass.classList.add('off');
    what.textContent = 'TV is off';
    sub.textContent = 'Tap Turn on to wake it.';
    return;
  }
  glass.classList.add('on');
  if(s.channel){ what.textContent = s.channel; sub.textContent = s.program ? s.program + ' · Live TV' : 'Live TV'; }
  else if(s.app_id && s.app_id.startsWith('tvinput.hdmi')){
    what.textContent = 'Pi screen'; sub.textContent = s.app || 'TV is on';
    glass.classList.add('pi');
    if(!document.hidden) $('shot').src = '/api/screen?t=' + Date.now();   /* live peek at the Pi's screen */
  }
  else if(s.app && s.app !== 'Roku'){ what.textContent = s.app; sub.textContent = 'TV is on'; }
  else { what.textContent = 'Home screen'; sub.textContent = 'TV is on'; }
}

$('shot').onload = e => e.target.classList.add('ok');
$('shot').onerror = e => e.target.classList.remove('ok');

function say(msg){
  toast.textContent = msg; toast.classList.add('show');
  clearTimeout(say.t); say.t = setTimeout(()=>toast.classList.remove('show'), 2600);
}

async function refresh(){
  try{ const r = await fetch('/api/status'); render(await r.json()); }
  catch(e){ render(null); }
}

document.addEventListener('click', async (ev)=>{
  const b = ev.target.closest('button'); if(!b) return;
  if(b.dataset.cam){
    if(!callId) return;
    try{
      const r = await postJSON('/api/camera/' + b.dataset.cam + '?id=' + callId, {});
      if(r.ok){ const c = await r.json(); say(c.zoom ? 'Zoom ' + c.zoom + ' of 9' : 'Wide view'); }
    }catch(e){}
    return;
  }
  let url;
  if(b.dataset.key) url = '/api/key/' + b.dataset.key + (b.dataset.n ? '?n=' + b.dataset.n : '');
  else if(b.dataset.app) url = '/api/launch/' + encodeURIComponent(b.dataset.app);
  else if(b.dataset.ch) url = '/api/channel/' + encodeURIComponent(b.dataset.ch);
  else if(b.dataset.vol) url = '/api/volume/' + b.dataset.vol;
  else return;
  if(b.dataset.confirm && !confirm(b.dataset.confirm)) return;
  b.disabled = true;
  try{
    const r = await fetch(url, {method:'POST'});
    if(r.status === 409){ say('Volume is being set. Wait a moment.'); return; }
    render(await r.json());
    say(r.ok ? 'Sent: ' + (b.getAttribute('aria-label') || b.firstChild.textContent.trim()) : "The TV didn't respond. Try again.");
  }catch(e){ say("Couldn't reach the Pi. Check Tailscale is on."); }
  finally{ b.disabled = false; }
});

refresh();
setInterval(refresh, 5000);

/* ---------- Call Mum ---------- */
let pc = null, localStream = null, callId = null, pollT = null, answered = false;
$('name').value = localStorage.getItem('callerName') || '';

function setStatus(t){ $('callStatus').textContent = t; }
function openView(t){ $('callview').classList.add('show'); setStatus(t); $('caption').textContent = ''; }
function closeView(){ $('callview').classList.remove('show'); }

function iceDone(p){
  return new Promise(res=>{
    if(p.iceGatheringState === 'complete') return res();
    const t = setTimeout(res, 3000);
    p.addEventListener('icegatheringstatechange', ()=>{ if(p.iceGatheringState === 'complete'){ clearTimeout(t); res(); } });
  });
}
const postJSON = (url, obj) => fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(obj)});

let peekAt = 0;

/* step 1: look in. The TV announces the caller; we get a pixelated view and decide. */
async function lookIn(){
  const name = $('name').value.trim();
  if(!name){ say('Type your name first, so Mum knows who is calling.'); $('name').focus(); return; }
  localStorage.setItem('callerName', name);
  if(!window.isSecureContext || !navigator.mediaDevices){ say('Calls need the https:// address of this page.'); return; }
  openView("Asking Mum's TV…");
  $('callview').classList.add('preview'); $('peek').removeAttribute('src'); peekAt = 0;
  let r;
  try{ r = await postJSON('/api/call/preview', {name}); }
  catch(e){ closeView(); say("Couldn't reach the Pi. Check Tailscale is on."); return; }
  if(r.status === 409){ closeView(); say('Someone else is already on a call with Mum.'); return; }
  if(!r.ok){ closeView(); say("The Pi didn't respond. Try again."); return; }
  callId = (await r.json()).id;
  pollT = setInterval(pollCall, 1000);
}

/* step 2: call now */
async function startCall(){
  if(!callId) return;
  const name = $('name').value.trim();
  $('callview').classList.remove('preview'); $('peek').removeAttribute('src');
  setStatus('Starting your camera…');
  try{
    localStream = await navigator.mediaDevices.getUserMedia({
      audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true},
      video:{width:{ideal:640}, height:{ideal:480}, facingMode:'user'}
    });
  }catch(e){ hangUp('no camera', 'Allow camera and microphone to call Mum.'); return; }
  $('meVideo').srcObject = localStream;
  pc = new RTCPeerConnection({iceServers:[]});
  localStream.getTracks().forEach(t=>pc.addTrack(t, localStream));
  pc.ontrack = e => { if($('mumVideo').srcObject !== e.streams[0]) $('mumVideo').srcObject = e.streams[0]; };
  pc.onconnectionstatechange = () => {
    if(!pc) return;
    if(pc.connectionState === 'connected') setStatus('');
    if(pc.connectionState === 'failed') hangUp('connection failed', 'The connection dropped. Try calling again.');
  };
  await pc.setLocalDescription(await pc.createOffer());
  await iceDone(pc);
  setStatus('Calling Mum…');
  let r;
  try{ r = await postJSON('/api/call/start', {id:callId, name, offer:pc.localDescription.sdp}); }
  catch(e){ teardown(); closeView(); say("Couldn't reach the Pi. Check Tailscale is on."); return; }
  if(r.status === 409){ teardown(); closeView(); say('The preview timed out. Try again.'); return; }
  if(!r.ok){ teardown(); closeView(); say("The Pi didn't start the call. Try again."); return; }
}

async function pollCall(){
  if(!callId) return;
  try{
    const s = await (await fetch('/api/call?role=caller&id=' + callId)).json();
    if(s.id !== callId){
      const why = {'no answer':"Mum's screen didn't answer. Check the Pi is switched on.",
                   'caller gone':'The call timed out.',
                   'preview timed out':"You didn't choose in time. Press Call Mum again."}[s.ended] || 'Call ended.';
      hangUp(null, why); return;
    }
    if(s.state === 'preview'){
      if(s.frame_at && s.frame_at !== peekAt){ peekAt = s.frame_at; $('peek').src = '/api/call/frame?id=' + callId + '&t=' + peekAt; setStatus(''); }
      return;
    }
    if(s.answer && !answered){
      answered = true;
      await pc.setRemoteDescription({type:'answer', sdp:s.answer});
      setStatus('Connecting…');
    }
    $('callVol').textContent = volText(s.vol);
    const bar = $('meterBar'), lv = s.level || 0;
    bar.style.width = lv + '%'; bar.classList.toggle('loud', lv > 75);
    $('caption').classList.toggle('nostt', !s.stt);
    $('caption').textContent = s.stt ? (s.caption || '') : '';
  }catch(e){}
}

function teardown(){
  clearInterval(pollT); pollT = null;
  if(pc){ pc.close(); pc = null; }
  if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream = null; }
  callId = null; answered = false;
  $('mumVideo').srcObject = null; $('meVideo').srcObject = null;
  $('micBtn').textContent = 'Mute my mic';
}

function hangUp(reason, msg){
  if(callId && reason) postJSON('/api/call/end', {id:callId, reason}).catch(()=>{});
  teardown(); closeView(); $('callview').classList.remove('preview'); if(msg) say(msg);
}

$('callBtn').addEventListener('click', lookIn);
$('callNowBtn').addEventListener('click', startCall);
$('notNowBtn').addEventListener('click', ()=>hangUp('not now', "OK, not now. Mum's TV says you'll call later."));
$('hangBtn').addEventListener('click', ()=>hangUp('hung up'));
$('micBtn').addEventListener('click', ()=>{
  const t = localStream && localStream.getAudioTracks()[0]; if(!t) return;
  t.enabled = !t.enabled;
  $('micBtn').textContent = t.enabled ? 'Mute my mic' : 'Unmute my mic';
});
window.addEventListener('pagehide', ()=>{
  if(callId) navigator.sendBeacon('/api/call/end', JSON.stringify({id:callId, reason:'caller left'}));
});
</script>
</body>
</html>
